<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYWELL</title>
<style>
:root{--bg:#07080C;--sf:#11151B;--tx:#EFEAE0;--mu:#9299A7;--gold:#D8B46E;--sage:#8FAE9A;--coral:#D98873;--ln:#ffffff1f}
*{box-sizing:border-box}
body{width:390px;margin:0;padding:16px;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font:400 16px Georgia,serif;letter-spacing:.22em}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.dot{width:7px;height:7px;border-radius:50%;background:var(--mu)}.dot.ok{background:var(--sage)}.dot.bad{background:var(--coral)}.dot.wait{background:var(--gold)}
h1{font:400 21px/1.25 Georgia,serif;margin:0 0 10px}
textarea{width:100%;min-height:118px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px;font:16px/1.5 Georgia,serif;resize:vertical}
textarea:focus{outline:2px solid var(--gold);outline-offset:0}
.meta{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;font-size:12px;color:var(--mu)}
.lnk{all:unset;cursor:pointer;color:var(--mu);font-size:12px;margin-left:12px;text-decoration:underline}.lnk:hover{color:var(--tx)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b{border:1px solid #ffffff33;background:none;color:var(--tx);border-radius:999px;padding:8px 15px;font:600 13px system-ui,sans-serif;cursor:pointer}
button.b:hover{border-color:var(--gold)}button.b:disabled{opacity:.5;cursor:default}
button.pri{background:var(--gold);border-color:var(--gold);color:#15110a}button.pri:hover{background:#e3c283}
button.pill{padding:5px 12px;font-weight:500;font-size:12.5px}button.pill.on{border-color:var(--gold);color:var(--gold)}
.go{width:100%;margin-top:12px;padding:11px}
#out{margin-top:14px}
h2{font:400 18px/1.3 Georgia,serif;margin:0 0 8px}
p{margin:6px 0;font-size:13px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid #D8B46E66;background:none;color:var(--gold);border-radius:99px;padding:5px 11px;font:500 12.5px system-ui;cursor:pointer}.chip.on{background:#D8B46E22}.chip small{color:var(--mu);margin-left:5px}
.det{background:#ffffff0a;border-radius:10px;padding:9px 11px;margin:6px 0;font-size:13px}.det b{color:var(--gold)}
.warn{background:#D9887322;border:1px solid #D9887366;border-radius:10px;padding:9px 11px;margin:8px 0;font-size:13px}
.sug{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}.lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.txt{font:400 17px/1.5 Georgia,serif;margin:8px 0 10px;white-space:pre-wrap}
.ok{color:var(--sage)}details{font-size:12.5px;color:var(--mu);margin-top:8px}summary{cursor:pointer}
.hard{margin-top:16px;padding-top:12px;border-top:1px solid var(--ln)}
.ft{margin-top:14px;font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;gap:6px}.ft label{display:flex;gap:6px;align-items:center;cursor:pointer}
.stage{color:var(--mu);font-size:13px;min-height:20px}
</style></head><body>
<div class="hd"><span class="logo">SAYWELL</span><span class="st"><span class="dot wait" id="dot"></span><span id="stt">Checking…</span></span></div>
<h1>What are you about to send?</h1>
<textarea id="t" placeholder="Write or paste it here." aria-label="Your message"></textarea>
<div class="meta"><span id="hint">Write or paste something.</span><span><button class="lnk" id="paste">Paste</button><button class="lnk" id="clear">Clear</button></span></div>
<div class="row" id="modes" role="group" aria-label="How should it change"></div>
<button class="b pri go" id="go">Check this</button>
<div id="out" aria-live="polite"></div>
<div class="hard"><div class="lab" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)">Hard conversation</div>
<div class="row" style="margin-top:8px"><button class="b pill" data-tool="boundary">Set a boundary</button><button class="b pill" data-tool="no">Say no</button><button class="b pill" data-tool="opener">Start the conversation</button></div></div>
<div class="ft"><label><input type="checkbox" id="auto"> Analyze automatically after I pause</label>
<span>Nothing is sent until you press Check this (or turn on the option above). Opening this popup reads your selected text on the page, nothing else.</span></div>
<script src="config.js"></script><script src="popup.js"></script></body></html>
