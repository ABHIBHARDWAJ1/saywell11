<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090B0F"><title>SAYWELL | Model card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polish.css"></head><body data-bg="model">
<header class="lh"><a class="logo" href="index.html">SAYWELL</a><nav><a href="features.html">Features</a><a href="method.html">Method</a><a href="extension.html">Extension</a><a href="privacy.html">Privacy</a><a href="model.html">Model card</a></nav><a class="btn ghost" href="downloads/saywell-extension.zip" download>Get the extension</a><a class="btn pri" href="index.html#top">Open Saywell</a></header>
<div class="pg glass-wrap wrap" style="max-width:900px"><h1>How the pattern detector was built</h1><div id="m" class="muted">Loading…</div></div>
<script>fetch('model_card.json').then(r=>r.json()).then(c=>{const d=c.dataset,dm=c.models.find(m=>m.name===c.deployed);
document.getElementById('m').innerHTML=`<p>${d.rows.toLocaleString()} labeled sentences (${d.english.toLocaleString()} English, ${d.hinglish.toLocaleString()} Hinglish). ${d.train.toLocaleString()} for training, ${d.test.toLocaleString()} for testing. ${d.split}</p>
<h3>Model comparison</h3><div class="sc"><table><tr><th>Model</th><th>Macro F1</th><th>Micro F1</th><th>Training rows</th><th>Seconds</th></tr>${c.models.map(m=>`<tr><td>${m.name}</td><td>${m.macro_f1}</td><td>${m.micro_f1}</td><td>${m.train_rows.toLocaleString()}</td><td>${m.train_seconds}</td></tr>`).join('')}</table></div>
${c.regression?`<h3>Regression</h3><p>${c.regression.name}: mean absolute error ${c.regression.mae}, R² ${c.regression.r2} on unseen templates. A negative R² means it does not beat predicting the average on unseen templates, so it is shown for comparison and is not used in the app.</p>`:''}<h3>${c.deployed} (running in the app), per pattern</h3><div class="sc"><table><tr><th>Pattern</th><th>Examples</th><th>Precision</th><th>Recall</th><th>F1</th></tr>${Object.entries(dm.per_label).map(([k,v])=>`<tr><td>${k.replace('_',' ')}</td><td>${d.labels[k].toLocaleString()}</td><td>${v.precision}</td><td>${v.recall}</td><td>${v.f1}</td></tr>`).join('')}</table></div>
<h3>What it is used for</h3><p>The detector notices language patterns (judgment, blame, absolute words, demands, unclear requests, sarcasm, safety-sensitive wording) so Saywell can point at them. In Conversation lens it shows how those patterns change across a chat. It is not a measure of anyone's emotions, intent or character, and it does not decide who is right.</p>
<h3>Limits</h3><p>${c.note}</p>`}).catch(()=>{document.getElementById('m').textContent='Could not load the model card.'})</script><script type="module" src="js/site.js"></script></body></html>
